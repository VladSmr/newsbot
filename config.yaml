# --- Поведение ---
# wall-clock слоты: :30 каждые 2 ч (00:30, 02:30, … 22:30, локальное время).
# poll_interval_minutes используется ТАКЖЕ как grace_period в pipeline.py
# (расширяет окно published на 120 мин — допустимо, защита границы).
poll_interval_minutes: 120

# --- База данных ---
database:
  path: data/newsbot.db
  retention_days: 1            # срок хранения processed/delivered/failed-items (сутки)
  retry_threshold_sec: 60 # pending считается зависшим через N секунд
  max_retries: 8           # лимит retry попыток → state=failed
  deferred_retention_days: 3  # удалять старые deferred-items старше N дней (не попали в digest).
                                  # 3 дня = запас на 6 дайджестов (08:00/21:00) при паузе/пропуске;
                                  # deferred теперь НЕ удаляется при закрытии окна (v1.1.5).
  recovery_new_limit: 500     # макс. 'new'-items, загружаемых в RAM при K1-recovery за один цикл
                                  # (при долгой паузе 'new' накапливаются; лимит защищает RAM)
  stuck_pending_limit: 500      # макс. 'pending'-items, загружаемых из retry-очереди за один цикл
                                  # (аналогичная защита RAM от большого backlog)

# --- Логирование ---
logging:
  level: INFO
  format: "%(asctime)s | v%(version)s | %(levelname)-8s | %(name)s | %(message)s"
  file: data/logs/newsbot.log   # ротируемый файл: 5 МБ, 3 backup-файла

# --- Telegram (заполняется на этапе 2) ---
telegram:
  token: ""
  chat_id: ""
  poll_timeout: 25       # seconds для long-poll getUpdates

# --- Дайджест ---
# Шлётся автоматически по расписанию (digest.times) и вручную --digest.
# Управляет отложенными новостями (score 5-6): они собираются и отправляются
# одним блоком. После успешной отправки получают state='digested'.
digest:
  enabled: true                       # вкл/выкл автоматический дайджест
  times: ["08:00", "20:00"]         # HH:MM в ЛОКАЛЬНОЙ tz; совпадает с format_time_utc
  max_items: 30                      # лимит новостей в одном дайджесте (≤30 самых важных, сортировка: score DESC, fetched_at ASC).
                                   # При 40 deferred-items в дайджест попадают только топ-30 (т.к. get_deferred_items LIMIT 30).
  max_items_per_message: 20         # новостей на одно Telegram-сообщение (НЕ БОЛЕЕ 4096 символов;
                                   # фактическая нарезка — по бюджету ≈4096 символов, а не по count;
                                   # при typical length ~400 chars/item реально ≈10 items)
  on_empty: skip                    # "skip" — не слать пустой дайджест; "send" — слать пустой (empty-text message)
  cluster_duplicates: true          # финальная LLM-кластеризация deferred перед отправкой (убирает дубли одного события)
  max_age_hours: 24                 # выбирать deferred-items не старше N часов (суточное окно)
  bootstrap_window_hours: 24        # окно начального наполнения дайджеста (сутки)
  window_anchor: "20:00"             # якорь HH:MM в локальном времени; граница окна =
                                    # всегда вчерашний предшествующий якорь (08:00 → вчера 20:00,
                                    # 20:00 → вчера 20:00). При anchor-режиме max_age_hours не
                                    # ограничивает выборку (lag scheduler не урезает 24ч-окно
                                    # владельца). При отсутствии/битом значении — fallback на
                                    # digest_window_started_at из meta.
  guarantee_min_score: 2           # порог llm_score для добора skipped-items в гарантию категорий
                                    # Пул гарантии: лучшие по score скоренные items, не попавшие в топ-N.
                                    # score=1 = отсеянные префильтром (llm_reason='prefilter'), не участвуют.
                                    # score=2..6 — реальные кандидаты; 2 достаточно для гарантии кино/прочего.
  max_per_location: 2               # макс. новостей на локацию/день в дайджесте

  # Минимум новостей по категории (каждая учитывается по скорингу)
  category_min:
    cinema: 2    # Deadline + Variety
    games: 1     # IGN + EuroGamer + DTF
    space: 1     # SpaceNews + NASA
    tech: 1      # Tom's Hardware + Habr
    cyber: 1     # Krebs + BleepingComputer
    science: 1   # ScienceDaily + Phys.org + N+1

# --- Фаза 2: обратная связь (👍/👎 после доставки новости) ---
# Кнопки обрабатываются в Фазе 2b, few-shot в промпте — Фазе 2c.
# feedback_targets хранятся коротко (кнопки живут ~retention_days),
# сама таблица feedback хранится практически вечно — это обучающие данные.
feedback:
  enabled: true                  # вкл/выкл приём фидбэка
  digest_enabled: false          # вкл/выкл 👍/👎 кнопок в дайджесте (дефолт false;
                                 # ссылка на новость остаётся в тексте как <a href>)
  max_examples: 10               # сколько последних вердиктов подмешивать в few-shot
  retention_days: 180             # удалять feedback_targets старше N дней
                                 # (сама таблица feedback не чистится —
                                 #  это обучающие данные для Фазы 2c)

# --- Дедупликация: кросс-источниковая (v9) ---
# Два уровня: (1) глобальный точный — title_hash без source в пределах window_days;
# (2) нечёткий (fuzzy) — SequenceMatcher, threshold 0.95, предфильтр по токен-сету.
# Fuzzy выполняется ТОЛЬКО при cross_source=true (кросс-источниковый контекст).
#
# Защита от ложных склеек (три условия И-вместе):
#   (a) ratio ≥ threshold (SequenceMatcher)
#   (b) числовые мультимножества совпадают (кратности учитываются) (\d+(?:[.,]\d+)?)
#   (c) Jaccard значащих токенов ≥ token_threshold (≥4 буквы, без стоп-слов)
# Дубль ⟺ (a) И (b) И (c)
#
# NOTE: семантические перефразы (одна новость разными словами) НЕ ловятся —
# нужны embeddings или LLM (отдельный этап).
dedup:
  cross_source: true             # уровень 1: глобальный точный дедуп по title_hash (без source)
  fuzzy: true                    # уровень 2: нечёткое сравнение (только при cross_source=true)
  threshold: 0.95                # порог SequenceMatcher ratio (0..1)
  token_threshold: 0.8           # порог Jaccard значащих токенов (0..1)
  window_days: 3                # окно сравнения для fuzzy и cross_source (в днях)
  # Лимит выборки заголовков за окно: страховка от неограниченной выборки
  # на большом объёме. 0 = без лимита (только окно). При достижении —
  # в лог пишется один WARNING за цикл (дедуп усечён).
  max_seen_titles: 2000
  llm_recent_limit: 20          # сколько недавних заголовков подмешивать в LLM-дедуп
  # prefetch_window_hours: окно для prefetch-кеша _domain_recent_duplicate (dedup.py).
  # При 2-часовом цикле кейс «ровно на границе» (2 ч назад — уже в БД, но не в prefetch)
  # приводит к дубликату на стыке циклов. Поднятие до 3 ч закрывает зазор.
  # dedup.py читает это значение через config (не хардкод).
  prefetch_window_hours: 3

# --- LLM-фильтр ---
llm:
  enabled: true
  provider: deepseek
  # llm_dedup: семантическая дедупликация через LLM (группировка «одно событие»).
  #   Дополняет лексический дедуп (cross_source/fuzzy) для перефразировок,
  #   межъязыковых дублей, разных формулировок чисел.
  #   При сбое LLM — безопасный пропуск (безопасно: ни один дубль не проходит).
  llm_dedup: true
  # dedup_chunk_size: 20  # если дедуп падает по пустому ответу (LLMError "Пустой content") — уменьшить с 40 до 20
  base_url: https://api.deepseek.com
  model: deepseek-flash          # ⚠️ проверить id живым ключом: python -m newsbot --check-llm
                                  #   При 4xx/404 — fallback (все новости без фильтра).
                                  #   Вернуть deepseek-v4-pro: одна строка выше.
                                  #   deepseek-flash дешевле: input ×4, output ×3.3 vs pro.
                                  #   deepseek-v4-pro: более способная альтернатива (одной строкой).
  api_key: ""                     # заполняется из .env DEEPSEEK_API_KEY
  temperature: 0
  timeout_sec: 60
  max_retries: 3
  push_threshold: 7               # score >= 7 → пуш (только если urgent при push_urgent_only=true)
  digest_threshold: 5             # 5..6 → дайджест; < 5 → skipped
  push_urgent_only: true           # пуш ТОЛЬКО срочные (urgent=true, score>=7); остальное → дайджест
                                   # ВАЖНО: при отсутствии ключа в конфиге — warning + дефолт True (urgent-only).
                                   # Legacy-поведение (все push) → явно задайте push_urgent_only: false.
  # max_pushes_per_cycle: лимит urgent-pushей за цикл; всё сверх лимита уходит в дайджест.
  #   0 = без лимита (обратно-совместимо). Пример: 3 пуша за цикл при частых срочных.
  max_pushes_per_cycle: 3
  balance:
    enabled: true
    threshold: 2.0
    check_interval_hours: 24
  max_per_cycle: 250            # макс. LLM-оценок (items) на цикл (12 слотов/сут × 250 = 3000 — покрывает поток при 2-часовом цикле)
  max_tokens: 4608             # лимит completion tokens (v15: title_en +25-50 токенов/item × 10 = +250-500; поднят с 4096)
  batch_size: 10              # оценка ≤10 новостей одним LLM-вызовом (1=поштучно)
  # Пиковые часы DeepSeek (будни МСК): 04:00–06:59 и 09:00–12:59.
  # LLM-вызовы блокируются; RSS-слоты (04:30/06:30/10:30/12:30) работают без скоринга.
  # Выходные — без пика, LLM вызывается свободно.
  off_peak_only: true
  # summary_max_chars: макс. длина summary в символах (от LLM-фильтра).
  #   Ограничивает output-токены и снижает стоимость.
  summary_max_chars: 240
  # two_phase: двухфазная фильтрация (phase2 для borderline items).
  two_phase:
    enabled: true
    phase2_min_score: 4          # items с score >= 4 идут во phase2
  # prefilter: быстрый синтаксический/ключевой предфильтр ДО LLM.
  prefilter:
    enabled: true
  # B12: system_prompt очищен. Источник истины — newsbot/llm/prompts.py.
  # Раскомментируйте и заполните только для override; иначе используется код.
  # system_prompt: ""
  # Pricing: USD per 1M tokens (DeepSeek-V4.1-Flash, verified from official price page, effective 10.09.2026)
  # Major #12: структура расширена — {input, output, cache_hit}.
  # Стоимость считается как: hit*cache_hit + miss*input + completion*output.
  # При отсутствии split'а hit/miss в ответе API — fallback на старую формулу
  # (все prompt_tokens по цене input — завышает стоимость, но сохраняет контракт).
  # NOTE: peak/off-peak не поддерживается (cost-guard использует off-peak цены).
  # Верифицированные данные для DeepSeek-V4.1-Flash:
  #   Off-Peak: cache_hit=$0.003, cache_miss=$0.15, output=$0.60
  #   Peak:     cache_hit=$0.006, cache_miss=$0.30, output=$1.20
  # deepseek-v4-pro: cache_hit не верифицирована (прайс-картинка покрывает только Flash).
  pricing:
    deepseek-flash:  {input: 0.15, output: 0.60, cache_hit: 0.003}
    deepseek-v4-pro: {input: 0.50, output: 2.00, cache_hit: 0.003}   # placeholder: не верифицировано
  # Daily cost limit per model (USD per UTC day); 0 = disabled
  # Items exceeding the limit remain pending and retry in the next cycle
  daily_cost_limit: 0.50