# --- Поведение ---
poll_interval_minutes: 15

# --- База данных ---
database:
  path: data/newsbot.db
  retention_days: 90       # удалять delivered/skipped items старше N дней
  retry_threshold_sec: 60 # pending считается зависшим через N секунд

# --- Логирование ---
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"

# --- Telegram (заполняется на этапе 2) ---
telegram:
  token: ""
  chat_id: ""
  poll_timeout: 25       # seconds для long-poll getUpdates

# --- Дайджест ---
# Шлётся автоматически по расписанию (digest.times) и вручную --digest.
# Управляет отложенными новостями (score 5-6): они собираются и отправляются
# одним блоком. После успешной отправки получают state='digested'.
digest:
  enabled: true                       # вкл/выкл автоматический дайджест
  times: ["09:00", "21:00"]         # HH:MM в ЛОКАЛЬНОЙ tz; совпадает с format_time_utc
  max_items: 100                     # лимит новостей в одном дайджесте (сортировка: score DESC, fetched_at ASC)
  max_items_per_message: 20         # новостей на одно Telegram-сообщение (не более 4096 символов)
  on_empty: skip                    # "skip" — не слать пустой дайджест; другое — на будущее

# --- Фаза 2: обратная связь (👍/👎 после доставки новости) ---
# Кнопки обрабатываются в Фазе 2b, few-shot в промпте — Фазе 2c.
# feedback_targets хранятся коротко (кнопки живут ~retention_days),
# сама таблица feedback хранится практически вечно — это обучающие данные.
feedback:
  enabled: true                  # вкл/выкл приём фидбэка
  max_examples: 10               # сколько последних вердиктов подмешивать в few-shot
  retention_days: 180             # удалять feedback_targets старше N дней
                                 # (сама таблица feedback не чистится —
                                 #  это обучающие данные для Фазы 2c)

# --- LLM-фильтр ---
llm:
  enabled: true
  provider: deepseek
  base_url: https://api.deepseek.com
  model: deepseek-flash          # ⚠️ проверить id живым ключом: python -m newsbot --check-llm
                                  #   При 4xx/404 — fallback (все новости без фильтра).
                                  #   Вернуть deepseek-v4-pro: одна строка выше.
                                  #   deepseek-flash дешевле: input ×4, output ×3.3 vs pro.
                                  #   deepseek-v4-pro: более способная альтернатива (одной строкой).
  api_key: ""                     # заполняется из .env DEEPSEEK_API_KEY
  temperature: 0
  timeout_sec: 60
  max_retries: 3
  push_threshold: 7               # score >= 7 → пуш
  digest_threshold: 5             # 5..6 → дайджест; < 5 → skipped
  balance:
    enabled: true
    threshold: 2.0
    check_interval_hours: 24
  max_per_cycle: 150
  # B12: system_prompt очищен. Источник истины — newsbot/llm/prompts.py.
  # Раскомментируйте и заполните только для override; иначе используется код.
  # system_prompt: ""